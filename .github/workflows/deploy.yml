name: Deploy to GitHub Pages

# Publishes the static game to the gh-pages branch, served at:
# https://anuragsingla911.github.io/GeometryDash/

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare publish directory
        run: |
          mkdir -p site/data
          cp index.html style.css script.js account-db.js favicon.svg README.md .nojekyll site/
          cp data/db.json site/data/

          # Inject PAT from repo secret ABC so create/login works across browsers.
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('data/config.json', 'utf8'));
          const token = process.env.ABC_TOKEN || '';
          cfg.githubToken = token;
          cfg.branch = cfg.branch || 'gh-pages';
          cfg.mirrorBranch = cfg.mirrorBranch || 'main';
          fs.writeFileSync('site/data/config.json', JSON.stringify(cfg, null, 2) + '\n');
          console.log(token ? 'Cloud sync token injected from secret ABC' : 'Secret ABC is empty/missing — accounts stay device-local');
          NODE
          rm -f site/CNAME
        env:
          ABC_TOKEN: ${{ secrets.ABC }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          # Wipe prior gh-pages files so a deleted CNAME cannot linger
          force_orphan: true
