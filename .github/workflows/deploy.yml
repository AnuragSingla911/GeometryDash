name: Deploy to GitHub Pages

# Publishes the static game to the gh-pages branch, served at:
# https://anuragsingla911.github.io/GeometryDash/

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare publish directory
        run: |
          mkdir -p site/data
          cp index.html style.css script.js account-db.js favicon.svg README.md .nojekyll site/
          cp data/db.json data/config.json site/data/
          # Ensure no custom-domain CNAME sneaks into gh-pages
          rm -f site/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          # Wipe prior gh-pages files so a deleted CNAME cannot linger
          force_orphan: true
