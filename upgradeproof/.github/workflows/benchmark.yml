name: UpgradeProof benchmark

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Unit tests
        working-directory: .
        run: python -m pytest -q
        env:
          PYTHONPATH: src
      - name: Feasibility benchmark
        run: python -m upgradeproof benchmark --out artifacts
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@v4
        with:
          name: upgradeproof-evidence
          path: |
            artifacts/**
            site/results.json
          if-no-files-found: error
          retention-days: 14
