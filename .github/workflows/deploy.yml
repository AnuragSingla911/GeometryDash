name: Deploy to GitHub Pages

# Publishes the static game to the gh-pages branch, served at:
# https://anuragsingla911.github.io/GeometryDash/

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare publish directory
        run: |
          mkdir -p site/data
          cp index.html style.css script.js account-db.js favicon.svg README.md .nojekyll site/
          cp data/db.json site/data/

          # Inject optional DB_SYNC_TOKEN so create/login works across browsers.
          # Add a fine-grained PAT (Contents: Read/Write on this repo) as repo secret DB_SYNC_TOKEN.
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('data/config.json', 'utf8'));
          const token = process.env.DB_SYNC_TOKEN || '';
          cfg.githubToken = token;
          cfg.branch = cfg.branch || 'gh-pages';
          cfg.mirrorBranch = cfg.mirrorBranch || 'main';
          fs.writeFileSync('site/data/config.json', JSON.stringify(cfg, null, 2) + '\n');
          console.log(token ? 'Cloud sync token injected into config.json' : 'No DB_SYNC_TOKEN secret — accounts stay device-local until configured');
          NODE
          rm -f site/CNAME
        env:
          DB_SYNC_TOKEN: ${{ secrets.DB_SYNC_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          # Wipe prior gh-pages files so a deleted CNAME cannot linger
          force_orphan: true
