[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upgradeproof"
version = "0.1.0"
description = "A bounded harness that upgrades one Python dependency, checks what breaks, and emits a tested patch with evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "UpgradeProof contributors"}]
keywords = ["dependencies", "upgrades", "testing", "harness"]

[project.scripts]
upgradeproof = "upgradeproof.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
upgradeproof = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --import-mode=importlib"
